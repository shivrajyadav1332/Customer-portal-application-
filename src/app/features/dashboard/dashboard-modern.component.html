<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="dashboard-layout">
    <div class="dashboard-container" *ngIf="!isLoading; else loading">
        <!-- Page Title -->
        <div class="page-header">
            <h1>Dashboard</h1>
            <p>Welcome back! Here's your smart gate system overview.</p>
        </div>

        <!-- KPI Cards Section -->
        <div class="kpi-section">
            <div class="kpi-grid">
                <app-kpi-card title="Total Vehicles" [value]="kpi.totalVehicles" icon="directions_car" [trend]="5">
                </app-kpi-card>

                <app-kpi-card title="Inside Plant" [value]="kpi.vehiclesInside" icon="local_shipping" [trend]="2">
                </app-kpi-card>

                <app-kpi-card title="Exited Today" [value]="kpi.vehiclesExitedToday" icon="check_circle" [trend]="8">
                </app-kpi-card>

                <app-kpi-card title="Pending" [value]="kpi.pendingVehicles" icon="schedule" [trend]="-2">
                </app-kpi-card>

                <app-kpi-card title="Total Weight" [value]="kpi.totalWeight | number:'1.0-0'" icon="scale" unit="KG"
                    [trend]="3">
                </app-kpi-card>

                <app-kpi-card title="Avg Weight" [value]="kpi.avgWeight | number:'1.0-2'" icon="trending_up" unit="KG"
                    [trend]="1">
                </app-kpi-card>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="charts-section">
            <!-- Vehicle Entry vs Exit Trend -->
            <mat-card class="chart-card">
                <mat-card-header>
                    <mat-card-title>Vehicle Entry vs Exit Trend</mat-card-title>
                    <mat-card-subtitle>Weekly comparison</mat-card-subtitle>
                </mat-card-header>
                <mat-card-content>
                    <canvas baseChart type="line" [data]="entryExitChartData" [options]="entryExitChartOptions">
                    </canvas>
                </mat-card-content>
            </mat-card>

            <!-- Daily Weight Trend -->
            <mat-card class="chart-card">
                <mat-card-header>
                    <mat-card-title>Daily Weight Trend</mat-card-title>
                    <mat-card-subtitle>Weekly weight distribution</mat-card-subtitle>
                </mat-card-header>
                <mat-card-content>
                    <canvas baseChart type="line" [data]="weightTrendChartData" [options]="weightTrendChartOptions">
                    </canvas>
                </mat-card-content>
            </mat-card>
        </div>
    </div>

    <!-- Loading State -->
    <ng-template #loading>
        <div class="loading-container">
            <mat-spinner></mat-spinner>
            <p>Loading Dashboard...</p>
        </div>
    </ng-template>
</div>
