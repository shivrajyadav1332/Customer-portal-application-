<mat-toolbar class="header-toolbar">
    <div class="header-content">
        <div class="header-left">
            <img src="assets/images/logo.png" alt="Yanbu Cement" class="logo" />
            <div class="brand">
                <span class="app-title">{{ companyName }}</span>
                <span class="app-subtitle">Customer Portal</span>
            </div>
        </div>

        <div class="header-center">
            <mat-icon>business</mat-icon>
            <span class="customer-name">{{ customerName }}</span>
        </div>

        <div class="header-right">
            <button mat-icon-button class="user-menu-btn" (click)="goToNotifications()" matTooltip="Notifications">
                <mat-icon [matBadge]="notificationCount" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
            </button>
            <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
                <mat-icon>account_circle</mat-icon>
            </button>
            <mat-menu #userMenu="matMenu">
                <div class="menu-user-info">
                    <strong>{{ customerName }}</strong>
                    <small>{{ currentUser?.email }}</small>
                </div>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="goToProfile()">
                    <mat-icon>person</mat-icon>
                    <span>Profile</span>
                </button>
                <button mat-menu-item (click)="logout()">
                    <mat-icon>logout</mat-icon>
                    <span>Logout</span>
                </button>
            </mat-menu>
        </div>
    </div>
</mat-toolbar>
